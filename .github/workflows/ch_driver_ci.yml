name: ch_driver CI

on:
  push:
    branches: [main]
    paths: ["ch_driver/**", ".github/workflows/ch_driver_ci.yml"]
  pull_request:
    paths: ["ch_driver/**", ".github/workflows/ch_driver_ci.yml"]

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ch_driver

    # ch_driver's test suite talks to a real ClickHouse server over the
    # native TCP protocol (no mocked transport), so CI needs a live instance.
    # Pinned to the same image/version adapter/docker-compose.yml uses
    # locally, with the same ports so nothing else in the test suite needs
    # to change between local dev and CI.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: |
            ch_driver/deps
            ch_driver/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('ch_driver/mix.lock') }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ch_driver/native/ch_driver_native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ch_driver/Cargo.lock') }}

      - run: mix deps.get
      - run: mix format --check-formatted

      # TEMPORARY: no ch_driver-v* GitHub release with precompiled NIF
      # binaries exists yet (this project was just renamed/consolidated from
      # ch_codec+ch_native -- see RELEASING.md), so RustlerPrecompiled's
      # normal download would 404. Force a local Rust build instead, same as
      # this workflow's own Rust toolchain setup above already supports.
      # Remove this once the first real ch_driver-v* tag has been released.
      - run: mix compile --warnings-as-errors
        env:
          RUSTLER_PRECOMPILED_FORCE_BUILD_ALL: "1"
      - run: mix test
        env:
          RUSTLER_PRECOMPILED_FORCE_BUILD_ALL: "1"

      - name: cargo test
        working-directory: ch_driver/native/ch_driver_native
        run: cargo test
