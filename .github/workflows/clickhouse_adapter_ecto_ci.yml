name: clickhouse_adapter_ecto CI

on:
  push:
    branches: [main]
    paths:
      [
        "ch_driver/**",
        "clickhouse_adapter_ecto/**",
        ".github/workflows/clickhouse_adapter_ecto_ci.yml",
      ]
  pull_request:
    paths:
      [
        "ch_driver/**",
        "clickhouse_adapter_ecto/**",
        ".github/workflows/clickhouse_adapter_ecto_ci.yml",
      ]

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: clickhouse_adapter_ecto

    # clickhouse_adapter_ecto's integration suite (test/integration,
    # @moduletag :integration) exercises a real Ecto.Repo against ClickHouse,
    # including one Kafka table-engine ingestion test -- both services are
    # provisioned here with the same pinned images/ports/env
    # clickhouse_adapter_ecto/docker-compose.yml uses locally, so CI and
    # local dev stay identical.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.7
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

      kafka:
        image: apache/kafka:3.7.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: |
            ch_driver/deps
            ch_driver/_build
            clickhouse_adapter_ecto/deps
            clickhouse_adapter_ecto/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('ch_driver/mix.lock', 'clickhouse_adapter_ecto/mix.lock') }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ch_driver/native/ch_driver_native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ch_driver/Cargo.lock') }}

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
