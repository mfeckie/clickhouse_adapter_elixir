name: ch_native CI

on:
  push:
    branches: [main]
    paths: ["ch_codec/**", "ch_native/**", ".github/workflows/ch_native_ci.yml"]
  pull_request:
    paths: ["ch_codec/**", "ch_native/**", ".github/workflows/ch_native_ci.yml"]

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ch_native
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: |
            ch_codec/deps
            ch_codec/_build
            ch_native/deps
            ch_native/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('ch_codec/mix.lock', 'ch_native/mix.lock') }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ch_codec/native/chcodec_native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ch_codec/Cargo.lock') }}

      # ch_native depends on ch_codec via a `path:` dep in local/CI dev mode
      # (see ch_native/mix.exs) -- ch_codec's NIF needs a Rust toolchain to
      # build from source since we aren't fetching a precompiled release
      # here.
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
