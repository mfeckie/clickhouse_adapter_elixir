name: ch_codec CI

on:
  push:
    branches: [main]
    paths: ["ch_codec/**", ".github/workflows/ch_codec_ci.yml"]
  pull_request:
    paths: ["ch_codec/**", ".github/workflows/ch_codec_ci.yml"]

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ch_codec
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: |
            ch_codec/deps
            ch_codec/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('ch_codec/mix.lock') }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ch_codec/native/chcodec_native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ch_codec/Cargo.lock') }}

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test

      - name: cargo test
        working-directory: ch_codec/native/chcodec_native
        run: cargo test
